name: release

# 把一次成功的 build run 产物发到 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 成功的 build run id
        required: true
        type: string
      tag:
        description: 版本标签
        required: true
        default: v1.0.3
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: packages
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mapfile -t files < <(find packages -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts from run ${{ github.event.inputs.run_id }}"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          notes=$'Windows / macOS / Linux 安装包。\n\n- Windows：x86_64 与 arm64 portable zip\n- macOS：Apple Silicon 与 Intel dmg\n- Linux：x86_64 与 arm64 AppImage'
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes "$notes" \
              "${files[@]}"
          fi
