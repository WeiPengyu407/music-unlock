name: build

# Windows x86_64 + Apple Silicon macOS 安装包流水线。
# 重资产策略：wrapper 镜像包 + 零件哈希表放在 GitHub Release "runtime-assets" 里
# （本机 docker save 产出，一次性上传）；浏览器组件因每系统二进制不同，
# 在各自 runner 上现场 patchright/camoufox 下载后打成内置 tar 包；
# Python 依赖全部打进 App（冻结模式不需要 wheels 目录）。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-14 # Apple Silicon（M 系列）：arm64 原生镜像 + arm64 零件
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false  # go 项目在构建期才 clone，仓库根没有 go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Python 依赖
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install camoufox==0.5.5

      - name: 构建 um 引擎（Go）
        env:
          GOPROXY: https://goproxy.cn,direct  # unlock-music.dev/mmkv 官方源 403，proxy.golang.org 未缓存，goproxy.cn 有缓存
        run: |
          # 官方源 git.unlock-music.dev 有 Cloudflare 盾；GitHub 镜像被 DMCA 下架；
          # 用 Codeberg 镜像（main 分支，比 tag 新）
          git clone --depth 1 https://codeberg.org/TTsdzb/unlock-music-cli.git /tmp/um-cli
          cd /tmp/um-cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o "$GITHUB_WORKSPACE/um.exe" ./cmd/um
          else
            go build -o "$GITHUB_WORKSPACE/um" ./cmd/um
          fi
        shell: bash

      - name: 构建 qmc-decoder 引擎（Rust）
        run: |
          cd vendor/qmc-decoder && cargo build --release
          cd ../..
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp vendor/qmc-decoder/target/release/qmc-decoder.exe .
          else
            cp vendor/qmc-decoder/target/release/qmc-decoder .
          fi
        shell: bash

      - name: 下载运行时资产（wrapper 镜像 + 零件哈希表）
        run: |
          mkdir -p assets
          BASE="https://github.com/${{ github.repository }}/releases/download/runtime-assets"
          TAR="wrapper-v2-image.tar.gz"
          [ "$RUNNER_ARCH" = "ARM64" ] && TAR="wrapper-v2-image-arm64.tar.gz"
          curl -sfL "$BASE/$TAR" -o "assets/$TAR"
          curl -sfL "$BASE/LIBS_VERSION.json" -o assets/LIBS_VERSION.json
        shell: bash

      - name: 浏览器组件打成内置包（每系统各自的二进制）
        run: |
          python -m patchright install chromium
          python -m camoufox fetch
          python - <<'PY'
          import os
          import sys
          import tarfile
          from pathlib import Path

          if sys.platform == "win32":
              base = Path(os.environ["LOCALAPPDATA"])
          elif sys.platform == "darwin":
              base = Path.home() / "Library" / "Caches"
          else:
              base = Path.home() / ".cache"
          camoufox = base / "camoufox"
          playwright = base / "ms-playwright"
          if not camoufox.is_dir():
              raise SystemExit(f"camoufox cache not found: {camoufox}")
          headless = next(iter(sorted(playwright.glob("chromium_headless_shell-*"))), None)
          ffmpeg = next(iter(sorted(playwright.glob("ffmpeg-*"))), None)
          if not headless or not ffmpeg:
              raise SystemExit(f"patchright cache incomplete: {playwright}")

          output = Path("assets") / "bundled"
          output.mkdir(parents=True, exist_ok=True)
          with tarfile.open(output / "browser-cache-camoufox.tar.gz", "w:gz") as archive:
              archive.add(camoufox, arcname=camoufox.name)
          with tarfile.open(output / "browser-cache-patchright.tar.gz", "w:gz") as archive:
              archive.add(headless, arcname=headless.name)
              archive.add(ffmpeg, arcname=ffmpeg.name)
          PY
        shell: bash

      - name: PyInstaller 冻结
        run: |
          BIN_UM="um"; BIN_QMC="qmc-decoder"; SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN_UM="um.exe"; BIN_QMC="qmc-decoder.exe"; SEP=";"; fi
          pyinstaller --noconfirm --windowed --onedir --name music-unlock \
            --hidden-import apkmirror_fetch --hidden-import PIL._tkinter_finder \
            --collect-all ttkbootstrap --collect-all tkinterdnd2 \
            --collect-all gamdl --collect-all scrapling \
            --collect-all patchright --collect-all camoufox \
            --add-binary "$BIN_UM$SEP." --add-binary "$BIN_QMC$SEP." \
            --add-data "assets${SEP}assets" \
            music_unlock.py
        shell: bash

      - name: 冻结包自检
        run: |
          APP="dist/music-unlock.app/Contents/MacOS/music-unlock"
          [ "$RUNNER_OS" = "Windows" ] && APP="dist/music-unlock/music-unlock.exe"
          "$APP" --self-test
        shell: bash

      - name: 打包 Windows（便携 zip + Inno 安装包）
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "1.0.2" }
          iscc "/DAppVersion=$version" packaging/installer.iss
          cd dist && 7z a "../音乐解锁-windows-x86_64-portable.zip" music-unlock && cd ..

      - name: 打包 macOS（dmg）
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dmg-root && cp -r dist/music-unlock.app dmg-root/ || cp -r dist/music-unlock dmg-root/
          hdiutil create -volname 音乐解锁 -srcfolder dmg-root -ov -format UDZO "音乐解锁-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: 音乐解锁-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            *.AppImage
            *.zip
            *.dmg
            Output/*.exe
          if-no-files-found: error
