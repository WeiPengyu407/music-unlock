name: build

# 安装包：Win x86_64 / arm64、macOS Apple Silicon / Intel、Linux x86_64 / arm64。
# 教训：资产必须在冻结前打进包；Windows 不要真跑 windowed --self-test；
# AppImage 不要 curl GitHub 下 runtime（用 gh + --runtime-file）；
# 产物文件名用 ASCII，否则 Release 会把中文吃掉。
# wrapper 镜像 / LIBS_VERSION.json / APK 在 Release "runtime-assets"。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Linux Tk
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk libtk8.6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Python 依赖
        run: python -m pip install -r requirements-build.txt

      - name: 构建 um 引擎（Go）
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          git clone --depth 1 https://codeberg.org/TTsdzb/unlock-music-cli.git /tmp/um-cli
          cd /tmp/um-cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o "$GITHUB_WORKSPACE/um.exe" ./cmd/um
          else
            go build -o "$GITHUB_WORKSPACE/um" ./cmd/um
          fi
        shell: bash

      - name: 构建 qmc-decoder 引擎（Rust）
        run: |
          cd vendor/qmc-decoder && cargo build --release
          cd ../..
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp vendor/qmc-decoder/target/release/qmc-decoder.exe .
          else
            cp vendor/qmc-decoder/target/release/qmc-decoder .
          fi
        shell: bash

      - name: 下载运行时资产（wrapper 镜像 + 零件哈希表）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          TAR="wrapper-v2-image.tar.gz"
          [ "$RUNNER_ARCH" = "ARM64" ] && TAR="wrapper-v2-image-arm64.tar.gz"
          gh release download runtime-assets -R "${{ github.repository }}" \
            -p "$TAR" -p LIBS_VERSION.json -D assets --clobber
        shell: bash

      - name: PyInstaller 冻结
        run: |
          BIN_UM="um"; BIN_QMC="qmc-decoder"; SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN_UM="um.exe"; BIN_QMC="qmc-decoder.exe"; SEP=";"; fi
          pyinstaller --noconfirm --windowed --onedir --name music-unlock \
            --hidden-import PIL._tkinter_finder \
            --collect-all ttkbootstrap --collect-all tkinterdnd2 \
            --collect-all gamdl \
            --add-binary "$BIN_UM$SEP." --add-binary "$BIN_QMC$SEP." \
            --add-data "assets${SEP}assets" \
            music_unlock.py
        shell: bash

      - name: 冻结包自检
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="wrapper-v2-image.tar.gz"
            [ "${{ matrix.arch }}" = "arm64" ] && TAR="wrapper-v2-image-arm64.tar.gz"
            python - "$TAR" <<'PY'
          import sys
          from pathlib import Path
          tar = sys.argv[1]
          root = Path("dist/music-unlock")
          exe = root / "music-unlock.exe"
          if not exe.is_file():
              raise SystemExit(f"missing {exe}")
          print("ok", exe)
          for pattern in ("um.exe", "qmc-decoder.exe", tar, "LIBS_VERSION.json"):
              hits = list(root.rglob(pattern))
              if not hits:
                  raise SystemExit(f"missing {pattern}")
              print("ok", hits[0])
          PY
          elif [ "$RUNNER_OS" = "macOS" ]; then
            dist/music-unlock.app/Contents/MacOS/music-unlock --self-test
          else
            dist/music-unlock/music-unlock --self-test
          fi
        shell: bash

      - name: 打包 Windows（便携 zip + Inno 安装包）
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "1.0.4" }
          $arch = "${{ matrix.arch }}"
          iscc "/DAppVersion=$version" "/DAppArch=$arch" packaging/installer.iss
          cd dist && 7z a "../music-unlock-windows-$arch-portable.zip" music-unlock && cd ..

      - name: 打包 macOS（dmg）
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dmg-root && cp -r dist/music-unlock.app dmg-root/ || cp -r dist/music-unlock dmg-root/
          for i in 1 2 3 4 5; do
            hdiutil create -volname 音乐解锁 -srcfolder dmg-root -ov -format UDZO "music-unlock-macos-${{ matrix.arch }}.dmg" && break
            sleep 8
          done
          test -s "music-unlock-macos-${{ matrix.arch }}.dmg"

      - name: 打包 Linux（AppImage）
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then AI_ARCH=aarch64; else AI_ARCH=x86_64; fi
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -a dist/music-unlock AppDir/usr/bin/music-unlock-dir
          cp packaging/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/music-unlock.desktop packaging/music-unlock.png AppDir/
          gh release download continuous -R AppImage/appimagetool \
            -p "appimagetool-${AI_ARCH}.AppImage" -D /tmp --clobber
          chmod +x "/tmp/appimagetool-${AI_ARCH}.AppImage"
          gh release download continuous -R AppImage/type2-runtime \
            -p "runtime-${AI_ARCH}" -D /tmp --clobber
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH="$AI_ARCH" "/tmp/appimagetool-${AI_ARCH}.AppImage" \
            --runtime-file "/tmp/runtime-${AI_ARCH}" --comp zstd \
            AppDir "music-unlock-linux-${{ matrix.arch }}.AppImage"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: music-unlock-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            *.AppImage
            *.zip
            *.dmg
            Output/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          path: packages
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find packages -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts"
            exit 1
          fi
          mkdir -p upload
          for f in "${files[@]}"; do cp "$f" "upload/$(basename "$f")"; done
          ls -lh upload
          notes=$'Windows / macOS / Linux 安装包。\n\n- Windows：x86_64 与 arm64 portable zip\n- macOS：Apple Silicon 与 Intel dmg\n- Linux：x86_64 与 arm64 AppImage'
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "$notes" \
            upload/* || gh release upload "${{ github.ref_name }}" upload/* --clobber --repo "${{ github.repository }}"
